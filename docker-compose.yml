services:
  minio:
    image: minio/minio:latest
    container_name: journal-pulse-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - /home/amer-test/journal-pulse/data:/data
