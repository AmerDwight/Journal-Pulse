[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "journal-pulse"
version = "0.1.0"
description = "Journal crawling and daily digest system backed by MinIO"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "feedparser>=6.0",
  "minio>=7.2",
  "apscheduler>=3.10",
  "discord.py>=2.7",
  "deep-translator>=1.11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]

[project.scripts]
journal-pulse = "journal_pulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/journal_pulse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
